<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Background -->
  <rect width="512" height="512" rx="110" fill="#f5f0eb"/>

  <!-- Connector lines -->
  <g stroke="#6b8f71" stroke-width="18" stroke-linecap="round">
    <!-- top-left large dark dot to its small satellite -->
    <line x1="190" y1="210" x2="225" y2="265"/>
    <!-- center-left medium dot to amber center -->
    <line x1="210" y1="295" x2="268" y2="355"/>
    <!-- bottom-left lollipop line -->
    <line x1="195" y1="390" x2="235" y2="355"/>
    <!-- right side: dark dot connected to small right -->
    <line x1="355" y1="280" x2="395" y2="260"/>
  </g>

  <!-- Standalone dots — light sage green (no connections) -->
  <!-- top center small -->
  <circle cx="285" cy="175" r="28" fill="#7a9e82"/>
  <!-- top right orange -->
  <circle cx="375" cy="205" r="35" fill="#d4883a"/>
  <!-- left isolated -->
  <circle cx="148" cy="295" r="32" fill="#4a7a52"/>
  <!-- center medium sage -->
  <circle cx="275" cy="245" r="36" fill="#7a9e82"/>
  <!-- bottom center small sage -->
  <circle cx="278" cy="440" r="26" fill="#5a8060"/>
  <!-- bottom right medium sage -->
  <circle cx="370" cy="370" r="30" fill="#7a9e82"/>
  <!-- bottom right small sage -->
  <circle cx="400" cy="430" r="22" fill="#7a9e82"/>
  <!-- bottom left small sage -->
  <circle cx="178" cy="430" r="25" fill="#5a8060"/>

  <!-- Connected dots -->
  <!-- top-left large dark green (lollipop head) -->
  <circle cx="190" cy="210" r="44" fill="#1e4d2b"/>
  <!-- its small satellite -->
  <circle cx="225" cy="265" r="16" fill="#6b8f71"/>
  <!-- center-left medium sage (connected to amber) -->
  <circle cx="210" cy="295" r="38" fill="#7a9e82"/>
  <!-- amber center node -->
  <circle cx="268" cy="355" r="38" fill="#d4883a"/>
  <!-- bottom-left lollipop -->
  <circle cx="195" cy="390" r="32" fill="#5a8060"/>
  <!-- right dark large -->
  <circle cx="355" cy="280" r="38" fill="#1e4d2b"/>
  <!-- right small connected -->
  <circle cx="395" cy="260" r="18" fill="#1e4d2b"/>
</svg>
